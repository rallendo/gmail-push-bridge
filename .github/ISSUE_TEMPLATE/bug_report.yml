name: Bug Report
description: Report a reproducible bug or issue with Gmail Push Bridge
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check existing issues and discussions before filing.
  - type: input
    id: os_version
    attributes:
      label: macOS Version
      description: What version of macOS are you running? (e.g. macOS 14.5 Sonoma, macOS 15.1 Sequoia)
      placeholder: e.g. macOS 15.1 Sequoia
    validations:
      required: true
  - type: dropdown
    id: auth_method
    attributes:
      label: Authentication Method
      description: Which authentication method are you using?
      options:
        - "Google OAuth 2.0 (Sign in with Google)"
        - "App Password (16 characters)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the problem.
      placeholder: |
        1. Open Gmail Push Bridge
        2. Click 'Connect'
        3. Send a test email from another device
        4. Notice Mail.app does not refresh
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Output
      description: Paste any console or terminal output (ensure sensitive details like email addresses or tokens are redacted).
      render: shell
